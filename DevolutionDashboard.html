<script>

    const files = ["WestMidlands", "London", "GreaterManchester", "NorthernIreland", "Scotland", "Wales"];

    for (const file of files) {
      const div = document.createElement("div");
      document.getElementById("charts").appendChild(div);
      vegaEmbed(div, file + ".json", {actions: false});
    }
